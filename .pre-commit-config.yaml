# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
    - repo: https://github.com/psf/black-pre-commit-mirror
      rev: 26.10.1
      hooks:
          - id: black
    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.3
      hooks:
          - id: codespell
            additional_dependencies:
                - tomli
    - repo: https://github.com/PyCQA/flake8
      rev: 7.5.0
      hooks:
          - id: flake8
    - repo: https://github.com/kynan/nbstripout
      rev: 0.9.1
      hooks:
          - id: nbstripout
            files: \.(ipynb)$
    - repo: local
      hooks:
          - id: no-review-ids
            name: no review ids or development history outside specs and proposals
            language: pygrep
            entry: '(?i:fix round|review round|re-review|reviewer.s probe|\bruling R\d|\breview r\d|\bprobe W\d|\bmeasured on R\d)|\bR-\d{3}\b|\((?:N|B|IMP|NB)-?r?\d+[a-z]?(?:,\s*[A-Z]+-?\d+[a-z]?)*\)|"""[A-Z]{1,3}\d+[a-z]?:|\bX6b?\b|\b(?:[Uu]ntil|[Aa]fter|[Bb]efore|removed in|joins in) [REPITW]\d+[a-z]?\b|\([A-Z]\d+[a-z]? follow-on\)'
            exclude: ^(specs|proposals)/|^\.pre-commit-config\.yaml$
